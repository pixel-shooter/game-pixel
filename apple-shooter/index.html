<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Apple Shooter Game Files</title>
	<link rel="canonical" href="https://eggycaronline.io/more-game/apple-shooter.html"/>
	<meta name="robots" content="noindex">
	<style type="text/css">
		html {
		   margin: 0px;
		   height: 100%;
		   width: 100%;
		}
		body{
			margin:0;
			width: 100%;
			height: 99vh;
		}
		center{
			width: 100%;
			height: 100%;
		}
		#container{
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body>
	<center>
		<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
		<script>
			window.RufflePlayer = window.RufflePlayer || {};
			window.RufflePlayer.config = {
			"autoplay": "off",letterbox: "on","splashScreen": true,"unmuteOverlay": "hidden","quality": "high" };
			window.addEventListener("load", (event) => {
				const ruffle = window.RufflePlayer.newest();
				const player = ruffle.createPlayer();
				const container = document.getElementById("container");
				container.appendChild(player);
				player.load("https://eggycaronline.io/flashgame/apple-shooter.swf");
				player.style.width = "100%";
				player.style.height = "100%";
			});
		</script>
		<div id="container"></div>
	</center>
	<script src="https://eggycaronline.io/site-scripts/frame.js"></script>
</body>
</html>
